[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-installer"
version = "0.2.0"
description = "Clone-based per-user installer for Dispatch"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
dispatch-installer = "dispatch_installer.cli:main"

[tool.setuptools]
packages = ["dispatch_installer"]

[tool.setuptools.package-dir]
dispatch_installer = "src/dispatch_installer"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
