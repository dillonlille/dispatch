schema_version: 1
id: example
display_name: Example Plugin
version: 0.1.0
summary: Bounded example showing the source-owned Dispatch plugin contract.
owner:
  data: example
  team: Dispatch Maintainers
paths:
  source: src
  tests: tests
  data: plugins/example/data
commands:
  test: ./scripts/test
  build: ./scripts/build
  verify: ./scripts/verify
  health: ./scripts/health
components:
  - id: example-tool
    kind: hermes-tool
    source: src/dispatch_example
    capabilities:
      read_local_data: true
      mutate_data: false
      collect: false
      network: false
      authentication: false
      direct_delivery: false
      long_running: false
    hermes:
      package: dispatch_example
      manifest: integration/hermes-plugins/dispatch_example/plugin.yaml
      adapter: integration/hermes-plugins/dispatch_example/__init__.py
      tool: dispatch_example
      toolset: dispatch_example
    actions:
      - {name: health, privilege: health}
      - {name: summary, privilege: read}
