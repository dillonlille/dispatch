name: Publish Dispatch bootstrap

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact approved 40-character commit on main"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deploy:
    name: Verify and deploy approved bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate requested commit
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current main commit
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          test "$(git rev-parse origin/main)" = "$APPROVED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify matching published stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$(python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/dillonlille/dispatch/releases?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              releases = json.load(response)
          published = [
              item for item in releases
              if isinstance(item, dict)
              and item.get("draft") is False
              and item.get("prerelease") is False
              and isinstance(item.get("tag_name"), str)
              and item["tag_name"]
          ]
          if not published:
              raise SystemExit("no published stable release exists")
          print(published[0]["tag_name"])
          PY
          )"
          git fetch --quiet origin "refs/tags/$release_tag:refs/tags/$release_tag"
          test "$(git rev-parse "refs/tags/$release_tag^{commit}")" = "$(git rev-parse HEAD)"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Verify source and bootstrap
        run: |
          python -B scripts/verify-source-export . --json
          shellcheck install.sh
          sh -n install.sh

      - name: Stage canonical bootstrap
        run: install -m 0755 install.sh installer/deploy/cloudflare/public/install.sh

      - name: Deploy Cloudflare bootstrap
        working-directory: installer/deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --ignore-scripts
          npx --no-install wrangler deploy --config wrangler.json
