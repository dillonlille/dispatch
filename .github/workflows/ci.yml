name: Dispatch CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Source, Core, installer, and built-in plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dispatch-core/requirements-dev.txt
            installer/pyproject.toml
            plugins/handbook/pyproject.toml
            plugins/companion-bridge/pyproject.toml
            plugins/paycom/pyproject.toml

      - name: Verify source safety
        run: python -B scripts/verify-source-export . --json

      - name: Check dependency lockfile freshness
        run: |
          python -m pip install -q uv
          python -B scripts/update-dependency-lock
          git diff --exit-code -- dispatch-core/requirements.lock || {
            echo "::error::dispatch-core/requirements.lock is stale. Run scripts/update-dependency-lock and commit the result."
            exit 1
          }

      - name: Install test dependencies and editable components
        run: |
          python -m pip install -r dispatch-core/requirements-dev.txt
          python -m pip install --no-deps --editable ./installer --editable ./plugins/handbook --editable ./plugins/paycom
          python -m pip install --editable ./plugins/companion-bridge

      - name: Run source, Core, installer, and built-in plugin tests
        run: python -B -m pytest -q -p no:cacheprovider tests dispatch-core/tests installer/tests plugins/handbook/tests plugins/companion-bridge/tests plugins/paycom/tests

      - name: Shell-check installation scripts
        run: |
          shellcheck install.sh
          sh -n install.sh

      - name: Shell-check plugin lifecycle scripts
        run: |
          for script in plugins/paycom/scripts/*; do
            shellcheck "$script"
            sh -n "$script"
          done

      - name: Run Paycom plugin tests through its lifecycle scripts
        run: |
          plugins/paycom/scripts/test
          plugins/paycom/scripts/verify

      - name: Smoke-run the source Core command
        run: python dispatch-core --help

  python-compat:
    name: Python 3.12 and 3.13 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            dispatch-core/requirements-dev.txt

      - name: Install test dependencies and editable components
        run: |
          python -m pip install -r dispatch-core/requirements-dev.txt
          python -m pip install --no-deps --editable ./installer --editable ./plugins/handbook --editable ./plugins/paycom
          python -m pip install --editable ./plugins/companion-bridge

      - name: Run source, Core, installer, and built-in plugin tests
        run: python -B -m pytest -q -p no:cacheprovider tests dispatch-core/tests installer/tests plugins/handbook/tests plugins/companion-bridge/tests plugins/paycom/tests

      - name: Smoke-run the source Core command
        run: python dispatch-core --help
