name: Dispatch CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Source, Core, installer, and built-in plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dispatch-core/requirements-dev.txt
            installer/pyproject.toml
            plugins/handbook/pyproject.toml
            plugins/companion-bridge/pyproject.toml

      - name: Verify source safety
        run: python -B scripts/verify-source-export . --json

      - name: Install test dependencies and editable components
        run: |
          python -m pip install -r dispatch-core/requirements-dev.txt
          python -m pip install --no-deps --editable ./installer --editable ./plugins/handbook
          python -m pip install --editable ./plugins/companion-bridge

      - name: Run source, Core, installer, and built-in plugin tests
        run: python -B -m pytest -q -p no:cacheprovider tests dispatch-core/tests installer/tests plugins/handbook/tests plugins/companion-bridge/tests

      - name: Shell-check installation scripts
        run: |
          shellcheck install.sh
          sh -n install.sh

      - name: Smoke-run the source Core command
        run: python dispatch-core --help
