name: Dispatch CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-policy:
    name: Source and manifest policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact source scope before installing dependencies
        run: python3 -B scripts/verify-source-export . --json

  tests:
    name: Python ${{ matrix.python }} source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            dispatch-core/pyproject.toml
            installer/pyproject.toml
      - name: Install component test environments
        run: python -m pip install "./dispatch-core[authentication,browser,dev]" ./installer
      - name: Verify repository and installer policies
        run: python -B -m pytest -q -p no:cacheprovider tests installer/tests
      - name: Verify Dispatch Core source
        run: ./dispatch-core/scripts/test

  plugin-tests:
    name: Deferred Handbook plugin (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: plugins/handbook/pyproject.toml
      - name: Install reviewed Core and the plugin-owned test environment
        run: python -m pip install ./dispatch-core "./plugins/handbook[dev]"
      - name: Verify Handbook independently
        run: ./plugins/handbook/scripts/test

  core-artifact-boundary:
    name: Build and verify Core-only wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dispatch-core/pyproject.toml
            installer/pyproject.toml
      - name: Build only explicit Core and installer project roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist/core" "$RUNNER_TEMP/dist/installer"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist/core" ./dispatch-core
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist/installer" ./installer
      - name: Verify exact Core wheel closure
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("$RUNNER_TEMP"/dist/core/dispatch_core-*.whl)
          test "${#core_wheels[@]}" -eq 1
          python -B scripts/verify-core-wheel "${core_wheels[0]}" --json
          test -z "$(find "$RUNNER_TEMP/dist" -type f -path '*/plugins/*' -print -quit)"
          test -z "$(find "$RUNNER_TEMP/dist" -type f -name 'dispatch_handbook*.whl' -print -quit)"
      - name: Clean-install built Core wheel
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("$RUNNER_TEMP"/dist/core/dispatch_core-*.whl)
          python -m venv "$RUNNER_TEMP/core-smoke"
          "$RUNNER_TEMP/core-smoke/bin/python" -m pip install --no-deps "${core_wheels[0]}"
          "$RUNNER_TEMP/core-smoke/bin/python" -c 'import dispatch_core, dispatch_core.browser_manager, dispatch_core.collection_manager, dispatch_core.command_interface, dispatch_core.health, dispatch_core.paths'
          "$RUNNER_TEMP/core-smoke/bin/dispatch-core" --help >/dev/null
          mkdir -m 700 "$RUNNER_TEMP/core-home" "$RUNNER_TEMP/core-run" "$RUNNER_TEMP/core-config" "$RUNNER_TEMP/core-data" "$RUNNER_TEMP/core-state" "$RUNNER_TEMP/core-cache"
          site_packages="$("$RUNNER_TEMP/core-smoke/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          export HOME="$RUNNER_TEMP/core-home"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/core-run"
          export DISPATCH_HOME="$RUNNER_TEMP/core-home/.dispatch"
          export DISPATCH_CODE_ROOT="$site_packages"
          export DISPATCH_CONFIG_ROOT="$RUNNER_TEMP/core-config"
          export DISPATCH_DATA_ROOT="$RUNNER_TEMP/core-data"
          export DISPATCH_STATE_ROOT="$RUNNER_TEMP/core-state"
          export DISPATCH_CACHE_ROOT="$RUNNER_TEMP/core-cache"
          export DISPATCH_RUNTIME_ROOT="$RUNNER_TEMP/core-run/dispatch"
          "$RUNNER_TEMP/core-smoke/bin/dispatch-core" health > "$RUNNER_TEMP/core-health.json"
          "$RUNNER_TEMP/core-smoke/bin/python" -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"] + "/core-health.json")); assert p["ok"] is True and p["status"] == "setup_incomplete" and p["data"]["operational"] is True'
      - name: Clean-install installer and stage the actual Core wheel
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("$RUNNER_TEMP"/dist/core/dispatch_core-*.whl)
          installer_wheels=("$RUNNER_TEMP"/dist/installer/dispatch_installer-*.whl)
          test "${#core_wheels[@]}" -eq 1
          test "${#installer_wheels[@]}" -eq 1
          application_root="$RUNNER_TEMP/application-smoke"
          mkdir -p "$application_root/home/.dispatch"
          chmod 700 "$application_root/home" "$application_root/home/.dispatch"
          python -m venv "$application_root/home/.dispatch/installer-venv"
          "$application_root/home/.dispatch/installer-venv/bin/python" -m pip install --no-deps "${installer_wheels[0]}"
          "$application_root/home/.dispatch/installer-venv/bin/dispatch-installer" --help >/dev/null
          "$application_root/home/.dispatch/installer-venv/bin/python" scripts/smoke-install-core-application "${core_wheels[0]}" --runtime-plan packaging/runtime-package-plan.json --work-root "$application_root"
