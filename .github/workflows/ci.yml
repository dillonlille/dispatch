name: Monorepo CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-policy:
    name: Source and manifest policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact source scope before installing dependencies
        run: python3 -B scripts/verify-source-export . --json

  tests:
    name: Python ${{ matrix.python }} source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            dispatch-core/pyproject.toml
            installer/pyproject.toml
      - name: Install component test environments
        run: python -m pip install "./dispatch-core[dev]" ./installer
      - name: Verify repository and installer policies
        run: python -B -m pytest -q -p no:cacheprovider tests installer/tests
      - name: Verify Dispatch Core source
        run: ./dispatch-core/scripts/test

  plugin-tests:
    name: Deferred Handbook plugin (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: plugins/handbook/pyproject.toml
      - name: Install reviewed Core and the plugin-owned test environment
        run: python -m pip install ./dispatch-core "./plugins/handbook[dev]"
      - name: Verify Handbook independently
        run: ./plugins/handbook/scripts/test

  core-artifact-boundary:
    name: Build and verify Core-only wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dispatch-core/pyproject.toml
            installer/pyproject.toml
      - name: Build only explicit Core and installer project roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist/core" "$RUNNER_TEMP/dist/installer"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist/core" ./dispatch-core
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist/installer" ./installer
      - name: Verify exact Core wheel closure
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("$RUNNER_TEMP"/dist/core/dispatch_core-*.whl)
          test "${#core_wheels[@]}" -eq 1
          python -B scripts/verify-core-wheel "${core_wheels[0]}" --json
          test -z "$(find "$RUNNER_TEMP/dist" -type f -path '*/plugins/*' -print -quit)"
          test -z "$(find "$RUNNER_TEMP/dist" -type f -name 'dispatch_handbook*.whl' -print -quit)"
      - name: Clean-install built Core wheel
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("$RUNNER_TEMP"/dist/core/dispatch_core-*.whl)
          python -m venv "$RUNNER_TEMP/core-smoke"
          "$RUNNER_TEMP/core-smoke/bin/python" -m pip install "${core_wheels[0]}"
          "$RUNNER_TEMP/core-smoke/bin/python" -c 'import dispatch_core, dispatch_core.authentication, dispatch_core.browser_manager, dispatch_core.collection_manager, dispatch_core.command_interface, dispatch_core.health, dispatch_core.paths'
          "$RUNNER_TEMP/core-smoke/bin/dispatch-core" --help >/dev/null
      - name: Clean-install installer and stage the actual Core wheel
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("$RUNNER_TEMP"/dist/core/dispatch_core-*.whl)
          installer_wheels=("$RUNNER_TEMP"/dist/installer/dispatch_installer-*.whl)
          test "${#core_wheels[@]}" -eq 1
          test "${#installer_wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/installer-smoke"
          "$RUNNER_TEMP/installer-smoke/bin/python" -m pip install "${installer_wheels[0]}"
          "$RUNNER_TEMP/installer-smoke/bin/dispatch-installer" --help >/dev/null
          "$RUNNER_TEMP/installer-smoke/bin/python" scripts/smoke-stage-core-wheel "${core_wheels[0]}" --work-root "$RUNNER_TEMP/staged-core"
