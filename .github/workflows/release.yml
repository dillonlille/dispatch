name: Publish Dispatch release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to verify and publish (for example v1.2.3)"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: dispatch-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    name: Verify exact tag and publish source release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$tag_commit" = "$head_commit"
          test "$head_commit" = "$(git rev-parse origin/main)"
          status_file="$RUNNER_TEMP/release-source-status"
          if ! git status --porcelain=v1 --untracked-files=all >"$status_file"; then
            printf '%s\n' 'Tagged source status could not be inspected.' >&2
            exit 1
          fi
          test ! -s "$status_file"
          printf 'Publishing tag %s at %s\n' "$RELEASE_TAG" "$head_commit"

      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dispatch-core/requirements-dev.txt
            installer/pyproject.toml
            plugins/handbook/pyproject.toml
            plugins/companion-bridge/pyproject.toml
            plugins/paycom/pyproject.toml

      - name: Verify exact tagged source
        run: python -B scripts/verify-source-export . --json

      - name: Install test dependencies and editable components
        run: |
          python -m pip install -r dispatch-core/requirements-dev.txt
          python -m pip install --no-deps --editable ./installer --editable ./plugins/handbook --editable ./plugins/paycom
          python -m pip install --editable ./plugins/companion-bridge

      - name: Run exact tagged source tests
        run: python -B -m pytest -q -p no:cacheprovider tests dispatch-core/tests installer/tests plugins/handbook/tests plugins/companion-bridge/tests plugins/paycom/tests

      - name: Shell-check installation scripts
        run: |
          shellcheck install.sh
          sh -n install.sh

      - name: Smoke-run the tagged source Core command
        run: python dispatch-core --help

      - name: Publish GitHub Release with generated notes and no assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Dispatch $RELEASE_TAG" \
            --generate-notes

      - name: Dispatch verified Vercel publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-bootstrap-vercel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="$RELEASE_TAG"
