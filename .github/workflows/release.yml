name: Publish Dispatch release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    name: Verify and publish immutable release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dispatch-core/pyproject.toml
            installer/pyproject.toml
      - name: Install reviewed verification environment
        run: python -m pip install "./dispatch-core[authentication,browser,dev]" ./installer
      - name: Verify source and behavior
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-source-export
          python -B -m pytest -q -p no:cacheprovider tests installer/tests
          ./dispatch-core/scripts/test
      - name: Build and finalize Core-only release assets
        shell: bash
        run: |
          set -euo pipefail
          product_version="$(python -c 'import json; print(json.load(open("packaging/installation-release-manifest.json"))["product"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$product_version"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p "$RUNNER_TEMP/build/core" "$RUNNER_TEMP/build/installer"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/build/core" ./dispatch-core
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/build/installer" ./installer
          core_wheels=("$RUNNER_TEMP"/build/core/dispatch_core-*.whl)
          installer_wheels=("$RUNNER_TEMP"/build/installer/dispatch_installer-*.whl)
          test "${#core_wheels[@]}" -eq 1
          test "${#installer_wheels[@]}" -eq 1
          scripts/finalize-installation-release \
            --installer-wheel "${installer_wheels[0]}" \
            --core-wheel "${core_wheels[0]}" \
            --output-dir "$RUNNER_TEMP/release"
          python -B scripts/render-bootstrap \
            --manifest "$RUNNER_TEMP/release/installation-release-manifest.json" \
            --installer-wheel "${installer_wheels[0]}" \
            --template installer/deploy/cloudflare/install.sh.in \
            --output "$RUNNER_TEMP/release/install.sh"
          sh -n "$RUNNER_TEMP/release/install.sh"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Dispatch ${GITHUB_REF_NAME#v}" \
            --notes "First Core-only Dispatch release. Install from https://dispatch.dillonlille.com/install.sh"
