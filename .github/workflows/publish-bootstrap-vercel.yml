name: Publish verified bootstrap to Vercel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Latest published Dispatch Release tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dispatch-vercel-bootstrap-production
  cancel-in-progress: false

env:
  MAX_BOOTSTRAP_BYTES: "1048576"

jobs:
  publish:
    name: Verify canonical bootstrap and trigger Vercel production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release or manual authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$head_commit" = "$(git rev-parse origin/main)"
          test -n "$RELEASE_TAG"
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$tag_commit" = "$head_commit"
          test "$RELEASE_TAG" = "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          status_file="$RUNNER_TEMP/source-status"
          if ! git status --porcelain=v1 --untracked-files=all >"$status_file"; then
            printf '%s\n' 'Source status could not be inspected.' >&2
            exit 1
          fi
          test ! -s "$status_file"

      - name: Verify source and shell
        run: |
          set -euo pipefail
          python3 -B scripts/verify-source-export . --json
          shellcheck install.sh scripts/build-vercel-bootstrap
          sh -n install.sh
          sh -n scripts/build-vercel-bootstrap

      - name: Stage canonical bootstrap outside the checkout
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/dispatch-bootstrap-public"
          scripts/build-vercel-bootstrap "$output"
          expected_sha="$(sha256sum install.sh | cut -d' ' -f1)"
          expected_commit="$(git rev-parse HEAD)"
          staged_sha="$(sha256sum "$output/install.sh" | cut -d' ' -f1)"
          test "$staged_sha" = "$expected_sha"
          test "$(stat -c %s "$output/install.sh")" -le "$MAX_BOOTSTRAP_BYTES"
          python3 -B - "$output/.well-known/dispatch-bootstrap.json" "$expected_commit" <<'PY'
          import json
          import pathlib
          import sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload != {"commit": sys.argv[2], "schema_version": 1}:
              raise SystemExit("staged Vercel authority marker is invalid")
          PY
          printf 'sha256=%s\n' "$expected_sha" >>"$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$expected_commit" >>"$GITHUB_OUTPUT"

      - name: Trigger exact-main Vercel deployment
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_BOOTSTRAP_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK"
          expected_commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$expected_commit" = "$(git rev-parse origin/main)"
          response="$RUNNER_TEMP/vercel-deploy-hook.json"
          curl -fsS --proto '=https' --tlsv1.2 --max-redirs 0 \
            --request POST --output "$response" "$DEPLOY_HOOK"
          python3 -B - "$response" <<'PY'
          import json
          import pathlib
          import sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          job = payload.get("job")
          if not isinstance(job, dict) or not isinstance(job.get("id"), str) or not job["id"]:
              raise SystemExit("Vercel deploy hook did not return one job ID")
          PY

      - name: Verify deployed Vercel bytes and headers
        env:
          EXPECTED_COMMIT: ${{ steps.stage.outputs.commit }}
          EXPECTED_SHA: ${{ steps.stage.outputs.sha256 }}
          PUBLIC_URL: ${{ vars.VERCEL_BOOTSTRAP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_URL"
          [[ "$PUBLIC_URL" == */install.sh ]]
          marker_url="${PUBLIC_URL%/install.sh}/.well-known/dispatch-bootstrap.json"
          work="$RUNNER_TEMP/vercel-bootstrap-verify"
          mkdir -m 0700 "$work"
          for attempt in {1..30}; do
            if ! curl -fsS --proto '=https' --tlsv1.2 --max-redirs 0 \
              --max-filesize "$MAX_BOOTSTRAP_BYTES" \
              --dump-header "$work/headers" --output "$work/body" \
              --write-out '%{http_code}' "$PUBLIC_URL" >"$work/status"; then
              sleep 10
              continue
            fi
            if ! curl -fsS --proto '=https' --tlsv1.2 --max-redirs 0 \
              --max-filesize 4096 --output "$work/marker" "$marker_url"; then
              sleep 10
              continue
            fi
            if [[ "$(<"$work/status")" != 200 ]] \
              || [[ "$(sha256sum "$work/body" | cut -d' ' -f1)" != "$EXPECTED_SHA" ]]; then
              sleep 10
              continue
            fi
            if python3 -B - "$work/headers" "$work/marker" "$EXPECTED_COMMIT" <<'PY'
          import json
          import pathlib
          import sys
          headers = pathlib.Path(sys.argv[1])
          marker = pathlib.Path(sys.argv[2])
          expected_commit = sys.argv[3]
          marker_payload = json.loads(marker.read_text(encoding="utf-8"))
          if marker_payload != {"commit": expected_commit, "schema_version": 1}:
              raise SystemExit("deployed Vercel authority marker is stale or invalid")
          lines = headers.read_text(encoding="iso-8859-1").replace("\r\n", "\n").splitlines()
          values = {}
          for line in lines[1:]:
              if not line or ":" not in line:
                  continue
              name, value = line.split(":", 1)
              values.setdefault(name.strip().lower(), []).append(value.strip().lower())
          required = {
              "content-type": "text/plain; charset=utf-8",
              "cache-control": "no-store, max-age=0",
              "x-content-type-options": "nosniff",
              "referrer-policy": "no-referrer",
              "x-robots-tag": "noindex, nofollow",
          }
          for name, expected in required.items():
              if values.get(name) != [expected]:
                  raise SystemExit(f"invalid {name}: {values.get(name)!r}")
          PY
            then
              printf 'Verified Vercel bootstrap: commit=%s sha256=%s url=%s\n' \
                "$EXPECTED_COMMIT" "$EXPECTED_SHA" "$PUBLIC_URL"
              git fetch --no-tags origin main
              test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
              exit 0
            fi
            sleep 10
          done
          printf '%s\n' 'Vercel bootstrap did not converge to the expected commit, bytes, and headers.' >&2
          exit 1
