[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-local-handbook"
version = "0.1.0"
description = "Portable read-only local handbook retrieval for Dispatch"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["dispatch-core==1.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
dispatch-handbook = "dispatch_handbook.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
