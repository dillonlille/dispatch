[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-companion-bridge"
version = "0.1.1"
description = "Source-owned Slack Socket Mode bridge for DSP Companion"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "annotated-types==0.8.0",
  "anyio==4.14.2",
  "certifi==2026.7.22",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.19",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "PyYAML==6.0.3",
  "slack-bolt==1.30.0",
  "slack-sdk==3.43.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.entry-points."dispatch.plugins"]
companion-bridge = "companion_bridge.service:handle"

[project.entry-points."dispatch.services"]
companion-bridge = "companion_bridge.foreground_service:run"

[project.entry-points."dispatch.configurators"]
companion-bridge = "companion_bridge.configurator:configure"

[tool.dispatch]
id = "companion-bridge"
capabilities = ["read_local_data", "mutate_data", "network", "authentication", "direct_delivery", "long_running"]

[tool.dispatch.authentication]
required_profiles = [{ provider = "amazon-operations" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
